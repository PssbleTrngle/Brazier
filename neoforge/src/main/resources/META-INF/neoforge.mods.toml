modLoader = "javafml"
loaderVersion = "[1,)"
displayUrl = "https://github.com/${repository}"
issueTrackerURL = "https://github.com/${repository}/issues"
license = "https://github.com/${repository}/blob/HEAD/LICENSE.md"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_author}"
description = "${mod_description}"
updateJSONURL = "https://api.modrinth.com/updates/${mod_id}/forge_updates.json?neoforge=only"

[[dependencies.${mod_id}]]
modId = "neoforge"
versionRange = "[21,)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "[1.21.1,)"
ordering = "NONE"
side = "BOTH"