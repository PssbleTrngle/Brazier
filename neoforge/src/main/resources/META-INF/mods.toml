modLoader = "javafml"
loaderVersion = "[47,)"
displayUrl = "https://github.com/${repository}"
issueTrackerURL = "https://github.com/${repository}/issues"
license = "https://github.com/${repository}/blob/master/LICENSE.txt"
showAsResourcePack = false

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_author}"
description = '''Prevent mob spawning with a beacon-like structure'''
updateJSONURL = "https://api.modrinth.com/updates/${mod_id}/forge_updates.json"

[[dependencies.${mod_id}]]
modId = "forge"
mandatory = true
versionRange = "[47,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "[1.20.1,)"
ordering = "NONE"
side = "BOTH"